apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-bot-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_GITHUB_USERNAME/gitops-drift-engine.git'
    path: k8s-manifests
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
